dev lgdtcp0
dev-type tun
topology subnet
ca /etc/lgd-tcp/ca.crt
cert /etc/lgd-tcp/host.crt
key /etc/lgd-tcp/host.key
tls-crypt /etc/lgd-tcp/tls-crypt.key
tls-version-min 1.2
cipher AES-256-GCM
auth SHA256
persist-key
persist-tun
keepalive 10 60
tun-mtu 1500
verb 3
proto tcp-server
port 11590
server 10.78.0.0 255.255.255.0 nopool
dh none
client-config-dir /etc/lgd-tcp/ccd
ccd-exclusive
client-to-client
remote-cert-tls client
data-ciphers AES-256-GCM:AES-128-GCM
status /run/lgd-tcp-status.log 10
