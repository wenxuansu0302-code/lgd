dev lgdtcp0
dev-type tun
topology subnet
ca /etc/lgd-tcp/ca.crt
cert /etc/lgd-tcp/host.crt
key /etc/lgd-tcp/host.key
tls-crypt /etc/lgd-tcp/tls-crypt.key
tls-version-min 1.2
cipher AES-256-GCM
auth SHA256
persist-key
persist-tun
keepalive 10 60
tun-mtu 1500
verb 3
client
proto tcp-client
remote 47.99.47.169 11590
nobind
remote-cert-tls server
verify-x509-name lgd-tcp-server name
connect-retry 3 15
connect-timeout 10
